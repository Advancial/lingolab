<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 4 · Spanish Basics | Lingo Lab</title>
<style>
  :root{--g:#58cc02;--bd:#dde5d8;--bg:#eef2ea}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#2b3a2b;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  #tabs{display:flex;align-items:flex-end;gap:4px;padding:6px 8px 0;background:var(--bg)}
  #tabList{display:flex;gap:4px;min-width:0;overflow:hidden}
  .tab{display:flex;align-items:center;gap:8px;max-width:210px;min-width:60px;padding:8px 10px;border-radius:10px 10px 0 0;background:#dfe6da;font-size:13px;cursor:pointer;white-space:nowrap}
  .tab.on{background:#fff}
  .tab span{overflow:hidden;text-overflow:ellipsis;flex:1}
  .tab b{font-weight:400;opacity:.6;padding:0 4px;border-radius:6px}
  .tab b:hover{background:#0001;opacity:1}
  #newTab{border:0;background:none;font-size:20px;cursor:pointer;padding:4px 10px;border-radius:8px}
  #newTab:hover{background:#0001}
  #bar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#fff;border-bottom:1px solid var(--bd)}
  #bar button{border:0;background:none;font-size:18px;width:34px;height:34px;border-radius:8px;cursor:pointer}
  #bar button:hover{background:#0001}
  #omni{flex:1;padding:9px 14px;border:1px solid var(--bd);border-radius:999px;background:#f5f8f3;font-size:14px;outline:none}
  #omni:focus{background:#fff;border-color:var(--g)}
  #viewport{flex:1;position:relative;background:#fff}
  #viewport iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #newtab{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding-top:12vh;background:#fff}
  #newtab h1{font-size:54px;margin:0 0 4px;color:var(--g);letter-spacing:-1px}
  #newtab p{margin:0 0 26px;color:#7a8c7a}
  #sf{width:min(620px,88vw);display:flex}
  #sq{flex:1;padding:15px 22px;font-size:17px;border:1px solid #d7ded2;border-radius:999px;outline:none;box-shadow:0 1px 6px #0001}
  #sq:focus{box-shadow:0 2px 12px #0002;border-color:var(--g)}
  #engines{display:flex;gap:8px;margin:16px 0 40px}
  .eng{padding:6px 14px;border-radius:999px;border:1px solid #d7ded2;font-size:13px;cursor:pointer;background:#fff}
  .eng.on{background:var(--g);border-color:var(--g);color:#fff}
  #links{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;width:min(640px,90vw)}
  .ql{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:14px;cursor:pointer;font-size:13px}
  .ql:hover{background:#f0f5ec}
  .ql i{width:46px;height:46px;border-radius:50%;background:#e8efe3;display:grid;place-items:center;font-style:normal;font-size:22px}
  #status{margin:14px 0 0;max-width:640px;text-align:center;color:#778;font-size:13px;white-space:pre-wrap;min-height:18px}
  #status.err{color:#c62828;font-weight:600}
</style></head><body>
<div id="app">
  <div id="tabs"><div id="tabList"></div><button id="newTab" title="New tab">+</button></div>
  <div id="bar">
    <button id="back" title="Back">‹</button><button id="fwd" title="Forward">›</button>
    <button id="reload" title="Reload">⟳</button><button id="home" title="Home">⌂</button>
    <input id="omni" placeholder="Search or enter a web address" autocomplete="off" spellcheck="false">
  </div>
  <div id="viewport">
    <div id="newtab">
      <h1>Search</h1><p>Search the web or type an address</p>
      <form id="sf"><input id="sq" placeholder="Search the web" autocomplete="off" autofocus></form>
      <div id="status">Setting up your study session…</div>
      <div id="engines"></div>
      <div id="links"></div>
    </div>
  </div>
</div>

<script src="/baremux/index.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const ENGINES = {
  DuckDuckGo: "https://duckduckgo.com/?q=",
  Google: "https://www.google.com/search?q=",
  Bing: "https://www.bing.com/search?q=",
  Brave: "https://search.brave.com/search?q=",
};
const LINKS = [
  ["Discord","💬","https://discord.com/app"],["Bluesky","🦋","https://bsky.app"],["YouTube","▶️","https://www.youtube.com"],
  ["Google","🔎","https://www.google.com"],["Reddit","👽","https://www.reddit.com"],
  ["Poki","🎮","https://poki.com"],["CrazyGames","🕹️","https://www.crazygames.com"],
  ["Wikipedia","📚","https://www.wikipedia.org"],["GitHub","🐙","https://github.com"],
];
let engine = "DuckDuckGo";
try { engine = localStorage.getItem("engine") || engine; } catch {}

let scramjet, ready = false, active = null, pending = null;
const tabs = [];
function setStatus(msg, isErr) { const el = $("status"); el.textContent = msg; el.className = isErr ? "err" : ""; }
const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(label + " timed out")), ms))]);
addEventListener("unhandledrejection", (e) => setStatus("Error: " + (e.reason && e.reason.message || e.reason), true));
addEventListener("error", (e) => setStatus("Script error: " + e.message, true));

function toUrl(v) {
  v = v.trim();
  if (/^https?:\/\//i.test(v)) return v;
  if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(v)) return "https://" + v;
  return ENGINES[engine] + encodeURIComponent(v);
}

function renderEngines() {
  $("engines").innerHTML = "";
  for (const name of Object.keys(ENGINES)) {
    const d = document.createElement("div");
    d.className = "eng" + (name === engine ? " on" : "");
    d.textContent = name;
    d.onclick = () => { engine = name; try { localStorage.setItem("engine", name); } catch {} renderEngines(); };
    $("engines").appendChild(d);
  }
}
function renderLinks() {
  for (const [name, icon, url] of LINKS) {
    const d = document.createElement("div");
    d.className = "ql"; d.innerHTML = `<i>${icon}</i>${name}`;
    d.onclick = () => go(active, url);
    $("links").appendChild(d);
  }
}

function renderTabs() {
  $("tabList").innerHTML = "";
  for (const t of tabs) {
    const d = document.createElement("div");
    d.className = "tab" + (t === active ? " on" : "");
    const s = document.createElement("span"); s.textContent = t.url ? t.title : "New Tab";
    const x = document.createElement("b"); x.textContent = "×";
    x.onclick = (e) => { e.stopPropagation(); closeTab(t); };
    d.onclick = () => activate(t);
    d.append(s, x); $("tabList").appendChild(d);
  }
}
function renderView() {
  for (const t of tabs) t.iframe.hidden = !(t === active && t.url);
  $("newtab").hidden = !!(active && active.url);
  $("omni").value = active && active.url ? active.url : "";
  renderTabs();
  if (active && !active.url) $("sq").focus();
}

function newTab(url) {
  const iframe = document.createElement("iframe");
  iframe.hidden = true;
  $("viewport").appendChild(iframe);
  const t = { frame: null, iframe, url: null, title: "New Tab" };
  tabs.push(t); active = t; renderView();
  if (url) go(t, url);
  return t;
}
function activate(t) { active = t; renderView(); }
function closeTab(t) {
  const i = tabs.indexOf(t);
  t.iframe.remove(); tabs.splice(i, 1);
  if (!tabs.length) return newTab();
  if (active === t) active = tabs[Math.min(i, tabs.length - 1)];
  renderView();
}
function go(t, input) {
  if (!t) return;
  if (!ready) {
    pending = [t, input];
    if (!$("status").classList.contains("err")) setStatus("Still setting up… it will open as soon as it's ready.");
    return;
  }
  const url = toUrl(input);
  t.url = url; t.title = url;
  if (!t.frame) t.frame = scramjet.createFrame(t.iframe);
  t.frame.go(url);
  renderView();
}

$("sf").addEventListener("submit", (e) => { e.preventDefault(); go(active, $("sq").value); $("sq").value = ""; });
$("omni").addEventListener("keydown", (e) => { if (e.key === "Enter") { go(active, $("omni").value); $("omni").blur(); } });
$("omni").addEventListener("focus", (e) => e.target.select());
$("newTab").onclick = () => newTab();
$("back").onclick = () => { try { active.iframe.contentWindow.history.back(); } catch {} };
$("fwd").onclick = () => { try { active.iframe.contentWindow.history.forward(); } catch {} };
$("reload").onclick = () => { try { active.iframe.contentWindow.location.reload(); } catch {} };
$("home").onclick = () => { if (active) { active.url = null; renderView(); } };

// keep tab titles + address bar in sync with where the page actually is
setInterval(() => {
  for (const t of tabs) {
    if (!t.url || !t.frame) continue;
    try {
      const w = t.iframe.contentWindow;
      const real = scramjet.decodeUrl(w.location.href);
      const title = w.document.title;
      let changed = false;
      if (real && /^https?:/.test(real) && real !== t.url) { t.url = real; changed = true; }
      if (title && title !== t.title) { t.title = title; changed = true; }
      if (changed) { renderTabs(); if (t === active && document.activeElement !== $("omni")) $("omni").value = t.url; }
    } catch {}
  }
}, 600);

// panic key: Escape twice quickly -> fake homepage
let last = 0;
addEventListener("keydown", (e) => {
  if (e.key === "Escape") { const n = Date.now(); if (n - last < 500) location.href = "/"; last = n; }
});

const loadScript = (src) => new Promise((res, rej) => {
  const el = document.createElement("script");
  el.src = src; el.onload = res; el.onerror = () => rej(new Error("failed " + src));
  document.head.appendChild(el);
});
async function loadController() {
  // scramjet.all.js is the classic (non-module) build that defines $scramjetLoadController.
  // (scramjet.bundle.js is an ES module and can't be loaded with a plain <script>.)
  for (const f of ["/scram/scramjet.all.js"]) {
    try { await loadScript(f); if (typeof $scramjetLoadController !== "undefined") return; } catch {}
  }
  let files = "";
  try { files = (await (await fetch("/learn/diag")).json()).files.join(", "); } catch {}
  throw new Error("Could not load the Scramjet controller. Files found in /scram: " + (files || "none"));
}

renderEngines(); renderLinks();
newTab(); // UI works immediately; proxy engine finishes starting in the background

(async () => {
  try {
    if (!("serviceWorker" in navigator)) throw new Error("Needs HTTPS (or localhost) and a non-private window");
    if (typeof BareMux === "undefined") throw new Error("/baremux/index.js did not load");
    setStatus("Loading proxy engine…");
    await loadController();

    setStatus("Starting proxy engine…");
    const { ScramjetController } = $scramjetLoadController();
    scramjet = new ScramjetController({
      prefix: "/service/",
      files: {
        wasm: "/scram/scramjet.wasm.wasm",
        all: "/scram/scramjet.all.js",
        sync: "/scram/scramjet.sync.js",
      },
      siteFlags: { "https://www.google.com/(search|sorry).*": { naiiveRewriter: true } },
    });
    await withTimeout(Promise.resolve(scramjet.init()), 15000, "Engine init");

    setStatus("Registering service worker…");
    await navigator.serviceWorker.register("/sw.js", { scope: "/" });
    await withTimeout(navigator.serviceWorker.ready, 15000, "Service worker start");

    setStatus("Connecting transport…");
    const conn = new BareMux.BareMuxConnection("/baremux/worker.js");
    const wisp = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/";
    await withTimeout(conn.setTransport("/libcurl/index.mjs", [{ wisp }]), 15000, "Transport setup");

    ready = true;
    setStatus("");
    if (pending) { const [t, i] = pending; pending = null; go(t, i); }
  } catch (e) {
    setStatus("Setup failed: " + e.message, true);
    console.error(e);
  }
})();
</script></body></html>
