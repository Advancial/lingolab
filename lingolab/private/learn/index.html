<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 4 · Spanish Basics | Lingo Lab</title>
<style>
  *{box-sizing:border-box} html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:#f4f7f2}
  header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid #dde5d8}
  header b{color:#3d9a3d;margin-right:8px}
  form{flex:1;display:flex;gap:8px}
  input{flex:1;padding:9px 12px;border:1px solid #cfd8c9;border-radius:10px;font-size:15px}
  button{padding:9px 16px;border:0;border-radius:10px;background:#58cc02;color:#fff;font-weight:700;cursor:pointer}
  iframe{width:100%;height:calc(100% - 55px);border:0;background:#fff}
  #msg{padding:40px;color:#667}
</style></head><body>
<header><b>Lingo Lab</b>
  <form id="f"><input id="q" placeholder="Search or enter a web address" autocomplete="off" autofocus><button>Go</button></form>
</header>
<div id="msg">Setting up your study session…</div>
<iframe id="frame" hidden></iframe>

<script src="/baremux/index.js"></script>
<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>
<script>
const frame = document.getElementById("frame"), msg = document.getElementById("msg");
let ready = false;

(async () => {
  try {
    await navigator.serviceWorker.register("/sw.js", { scope: "/service/" });
    const conn = new BareMux.BareMuxConnection("/baremux/worker.js");
    const wisp = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/";
    await conn.setTransport("/epoxy/index.mjs", [{ wisp }]);
    ready = true; msg.textContent = "Ready. Type a site or search above.";
  } catch (e) { msg.textContent = "Setup failed: " + e.message; }
})();

function toUrl(v) {
  v = v.trim();
  if (/^https?:\/\//i.test(v)) return v;
  if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)) return "https://" + v;
  return "https://duckduckgo.com/?q=" + encodeURIComponent(v);
}
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!ready) return;
  const url = toUrl(document.getElementById("q").value);
  frame.src = __uv$config.prefix + __uv$config.encodeUrl(url);
  frame.hidden = false; msg.hidden = true;
});

// panic key: press Escape twice quickly to jump to the decoy homepage
let last = 0;
addEventListener("keydown", (e) => {
  if (e.key === "Escape") { const n = Date.now(); if (n - last < 500) location.href = "/"; last = n; }
});
</script></body></html>
